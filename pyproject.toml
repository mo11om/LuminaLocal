[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-matcher"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-community",
    "langchain-ollama",
    "langchain-openai",
    "langchain-huggingface",
    "langgraph",
    "chromadb",
    "rank-bm25",
    "pypdf",
    "sentence-transformers",
    "pydantic",
    "typing-extensions",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
