<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 996" width="1580" height="996" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Sequence diagram of the LuminaLocal pipeline. The batch runner loads job descriptions and skips jobs already present in the output CSV. For each remaining job, run in parallel across MAX_WORKERS threads, LangGraph decomposes the requirements into one query per skill, retrieves from Chroma and BM25 under a lock, filters hits by relevance score, sends the context to the LLM for analysis, verifies the classification against the skill counts, then audits the result with a second LLM call. A failed audit re-enters retrieval up to three times. The final result is appended to the CSV and flushed per row.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474F"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78909C"/>
    </marker>
  </defs>

  <rect width="1580" height="996" fill="#FFFFFF"/>

  <!-- ===== lifelines ===== -->
  <g stroke="#B0BEC5" stroke-width="1.4" stroke-dasharray="5 5">
    <line x1="110"  y1="72" x2="110"  y2="924"/>
    <line x1="345"  y1="72" x2="345"  y2="924"/>
    <line x1="620"  y1="72" x2="620"  y2="924"/>
    <line x1="910"  y1="72" x2="910"  y2="924"/>
    <line x1="1190" y1="72" x2="1190" y2="924"/>
    <line x1="1450" y1="72" x2="1450" y2="924"/>
  </g>

  <!-- ===== participants (top) ===== -->
  <g stroke-width="1.8">
    <rect x="15"   y="20" width="190" height="52" rx="8" fill="#FCE4EC" stroke="#C2185B"/>
    <rect x="245"  y="20" width="200" height="52" rx="8" fill="#E0F2F1" stroke="#00897B"/>
    <rect x="525"  y="20" width="190" height="52" rx="8" fill="#FFF3E0" stroke="#E65100"/>
    <rect x="805"  y="20" width="210" height="52" rx="8" fill="#E1F5FE" stroke="#0277BD"/>
    <rect x="1090" y="20" width="200" height="52" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
    <rect x="1360" y="20" width="180" height="52" rx="8" fill="#F3E5F5" stroke="#6A1B9A"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1A1A2E" text-anchor="middle">
    <text x="110"  y="43">JSON Job List</text>
    <text x="345"  y="43">Batch Runner</text>
    <text x="620"  y="43">LangGraph</text>
    <text x="910"  y="43">Retrieval</text>
    <text x="1190" y="43">LLM</text>
    <text x="1450" y="43">Output CSV</text>
  </g>
  <g font-size="10.5" fill="#546E7A" text-anchor="middle">
    <text x="110"  y="60">JOBS_FILE</text>
    <text x="345"  y="60">ThreadPoolExecutor</text>
    <text x="620"  y="60">agent state machine</text>
    <text x="910"  y="60">Chroma (dense) + BM25 (sparse)</text>
    <text x="1190" y="60">Ollama / OpenAI / vLLM</text>
    <text x="1450" y="60">append + flush per row</text>
  </g>

  <!-- ===== msg 1: load jobs ===== -->
  <line x1="110" y1="112" x2="337" y2="112" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="223" y="105" font-size="12.5" fill="#263238" text-anchor="middle">Load job descriptions</text>

  <!-- ===== msg 2: checkpoint ===== -->
  <line x1="1450" y1="158" x2="353" y2="158" stroke="#78909C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
  <text x="900" y="151" font-size="12.5" fill="#263238" text-anchor="middle">load_completed_jobs() &#8594; skip jobs already written  (crash-safe resume)</text>

  <!-- ===== outer loop frame ===== -->
  <rect x="265" y="186" width="1260" height="710" rx="6" fill="none" stroke="#78909C" stroke-width="1.4"/>
  <path d="M265 186 h305 v22 h-16 l-8 8 h-281 z" fill="#ECEFF1" stroke="#78909C" stroke-width="1.4"/>
  <text x="277" y="201" font-size="11" font-weight="700" fill="#37474F">loop  [ per job — MAX_WORKERS threads in parallel ]</text>

  <!-- msg 3: invoke -->
  <line x1="345" y1="238" x2="612" y2="238" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="478" y="231" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#263238" text-anchor="middle">app.invoke(job)</text>

  <!-- ===== inner revision frame ===== -->
  <rect x="555" y="262" width="790" height="528" rx="6" fill="none" stroke="#E65100" stroke-width="1.3" stroke-dasharray="7 4"/>
  <path d="M555 262 h355 v22 h-16 l-8 8 h-331 z" fill="#FFF3E0" stroke="#E65100" stroke-width="1.3"/>
  <text x="567" y="277" font-size="11" font-weight="700" fill="#E65100">loop  [ retrieve &#8594; analyze &#8594; critique · up to 3 revisions ]</text>

  <!-- self: decompose -->
  <path d="M620 308 h44 v24 h-36" fill="none" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="674" y="303" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#263238">decompose_requirements() &#8594; one query per required skill</text>

  <!-- msg: retrieve -->
  <line x1="620" y1="366" x2="902" y2="366" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="761" y="359" font-size="12.5" fill="#263238" text-anchor="middle">per skill: scored dense search + BM25   [retrieval_lock]</text>

  <!-- return: hits -->
  <line x1="910" y1="404" x2="628" y2="404" stroke="#78909C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
  <text x="769" y="397" font-size="12.5" fill="#263238" text-anchor="middle">hits &#8805; RETRIEVER_MIN_SCORE, deduped, appended to prior context</text>

  <!-- note: unresolved -->
  <path d="M700 420 h420 v44 h-420 z" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.3"/>
  <g font-size="11.5" fill="#5D4037">
    <text x="712" y="437">A skill with no hit above the threshold is recorded as</text>
    <text x="712" y="453">[UNRESOLVED …] in the context — never silently dropped.</text>
  </g>

  <!-- msg: analyze -->
  <line x1="620" y1="500" x2="1182" y2="500" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="901" y="493" font-size="12.5" fill="#263238" text-anchor="middle">analyze: retrieved context + job requirements  (json_mode)</text>

  <!-- note: retry -->
  <path d="M1010 516 h325 v44 h-325 z" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.3"/>
  <g font-size="11.5" fill="#5D4037">
    <text x="1022" y="533">Rate limit / timeout / connection error &#8594;</text>
    <text x="1022" y="549">backoff retry, then API_UNAVAILABLE sentinel.</text>
  </g>

  <!-- return: analysis -->
  <line x1="1190" y1="586" x2="628" y2="586" stroke="#78909C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
  <text x="909" y="579" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#263238" text-anchor="middle">AnalysisResult JSON</text>

  <!-- self: verify -->
  <path d="M620 616 h44 v24 h-36" fill="none" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="674" y="611" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#263238">verify_classification() &#8594; override label if it contradicts skill counts</text>

  <!-- msg: critique -->
  <line x1="620" y1="674" x2="1182" y2="674" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="901" y="667" font-size="12.5" fill="#263238" text-anchor="middle">critique: audit the analysis against that same context</text>

  <!-- return: critique -->
  <line x1="1190" y1="712" x2="628" y2="712" stroke="#78909C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
  <text x="909" y="705" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#263238" text-anchor="middle">CritiqueResult { verdict: PASS | FAIL, reason }</text>

  <!-- note: routing -->
  <path d="M600 728 h610 v50 h-610 z" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.3"/>
  <g font-size="11.5" fill="#5D4037">
    <text x="612" y="745">FAIL and revision &lt; 3  &#8594;  re-enter <tspan font-weight="700">retrieve</tspan>, widening the context with the critique as a hint.</text>
    <text x="612" y="763">PASS, or 3 revisions spent  &#8594;  leave the loop with the current result.</text>
  </g>

  <!-- ===== end inner frame ===== -->

  <!-- msg: final -->
  <line x1="620" y1="830" x2="353" y2="830" stroke="#78909C" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahd)"/>
  <text x="486" y="823" font-size="12.5" fill="#263238" text-anchor="middle">final AnalysisResult</text>

  <!-- msg: write -->
  <line x1="345" y1="872" x2="1442" y2="872" stroke="#37474F" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="893" y="865" font-size="12.5" fill="#263238" text-anchor="middle">append row + flush immediately   [csv_lock]   — not batched until the end</text>

  <!-- ===== participants (bottom) ===== -->
  <g stroke-width="1.8">
    <rect x="15"   y="924" width="190" height="52" rx="8" fill="#FCE4EC" stroke="#C2185B"/>
    <rect x="245"  y="924" width="200" height="52" rx="8" fill="#E0F2F1" stroke="#00897B"/>
    <rect x="525"  y="924" width="190" height="52" rx="8" fill="#FFF3E0" stroke="#E65100"/>
    <rect x="805"  y="924" width="210" height="52" rx="8" fill="#E1F5FE" stroke="#0277BD"/>
    <rect x="1090" y="924" width="200" height="52" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
    <rect x="1360" y="924" width="180" height="52" rx="8" fill="#F3E5F5" stroke="#6A1B9A"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1A1A2E" text-anchor="middle">
    <text x="110"  y="955">JSON Job List</text>
    <text x="345"  y="955">Batch Runner</text>
    <text x="620"  y="955">LangGraph</text>
    <text x="910"  y="955">Retrieval</text>
    <text x="1190" y="955">LLM</text>
    <text x="1450" y="955">Output CSV</text>
  </g>
</svg>
